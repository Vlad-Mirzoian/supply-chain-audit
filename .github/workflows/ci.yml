name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test (race detector)
        run: go test -race ./...
      - name: Cross-compile
        run: |
          for t in linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/ssca
          done
      - name: Build
        run: go build -o ssca ./cmd/ssca
      - name: Audit own CI configuration
        run: ./ssca ci-audit .
