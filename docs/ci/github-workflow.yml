# GitHub Actions template for ssca (NFR-04): copy to .github/workflows/.
# Set the repository variables SSCA_RELEASE_URL (a pinned release of ssca) and
# SSCA_RELEASE_SHA256 (its checksum). Every action is pinned to a commit.
name: supply-chain
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ssca (pinned release, checksum verified)
        run: |
          curl -sSfL -o ssca "$SSCA_URL"
          echo "$SSCA_SHA256  ssca" | sha256sum -c -
          chmod +x ssca && sudo mv ssca /usr/local/bin/ssca
        env:
          SSCA_URL: ${{ vars.SSCA_RELEASE_URL }}
          SSCA_SHA256: ${{ vars.SSCA_RELEASE_SHA256 }}
      - name: Audit CI configuration (M5)
        run: ssca ci-audit .
      - name: Restore ssca data snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ssca
          key: ssca-snapshot-${{ github.run_id }}
          restore-keys: ssca-snapshot-
      - name: Supply-chain audit and policy gate (M0-M6)
        run: ssca scan --out ssca-out .
      - name: Save ssca data snapshot
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ssca
          key: ssca-snapshot-${{ github.run_id }}
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ssca-out/findings.sarif
      - name: Keep evidence bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssca-evidence
          path: ssca-out/
